name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs build the desktop bundles without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  static:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: brainproxy-linux-x86_64
          - target: aarch64-unknown-linux-musl
            asset: brainproxy-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (x86_64, musl-gcc)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          make static TARGET=${{ matrix.target }}
      - name: Build (arm64, zig as cross C compiler)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --locked
          make static-arm64
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/brainproxy
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y qemu-user-static
            run="qemu-aarch64-static $bin"
          else
            run="$bin"
          fi
          file "$bin"
          $run --version
          $run --format json --project /tmp/smoke.bpdb capabilities > /dev/null
          $run --format json --project /tmp/smoke.bpdb engagement start --target 127.0.0.1
      - run: |
          cp target/${{ matrix.target }}/release/brainproxy ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      asset: brainproxy-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p brainproxy
      - name: Smoke test
        run: |
          bin=target/release/brainproxy.exe
          $bin --version
          $bin --format json --project smoke.bpdb capabilities > /dev/null
          $bin --format json --project smoke.bpdb engagement start --target 127.0.0.1
      - run: |
          cp target/release/brainproxy.exe $asset
          sha256sum $asset > $asset.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256

  # The desktop GUI (gui/): type-check and build the frontend on every push.
  gui-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Desktop bundles with the CLI inside (Tauri sidecar), on tags and manual runs.
  gui:
    needs: [check, gui-check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: brainproxy-gui-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: brainproxy-gui-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: brainproxy-gui-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}
          workspaces: |
            . -> target
            gui/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the CLI sidecar
        run: |
          cargo build --release --target ${{ matrix.target }} -p brainproxy
          mkdir -p gui/src-tauri/binaries
          exe=$([ "${{ runner.os }}" = Windows ] && echo .exe || true)
          cp target/${{ matrix.target }}/release/brainproxy$exe gui/src-tauri/binaries/brainproxy-${{ matrix.target }}$exe
      - run: npm ci
        working-directory: gui
      - name: Bundle
        working-directory: gui
        # externalBin only here, so local `cargo tauri dev` needs no sidecar file.
        run: npx tauri build --target ${{ matrix.target }} --config '{"bundle":{"externalBin":["binaries/brainproxy"]}}'
      - name: Collect bundles
        run: |
          dir=gui/src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          if [ "${{ runner.os }}" = macOS ]; then
            cp "$dir"/dmg/*.dmg out/${{ matrix.asset }}.dmg
          elif [ "${{ runner.os }}" = Windows ]; then
            cp "$dir"/msi/*.msi out/${{ matrix.asset }}.msi
            cp "$dir"/nsis/*-setup.exe out/${{ matrix.asset }}-setup.exe
          else
            cp "$dir"/deb/*.deb out/${{ matrix.asset }}.deb
            cp "$dir"/appimage/*.AppImage out/${{ matrix.asset }}.AppImage
          fi
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          cd out && for f in *; do sum "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
