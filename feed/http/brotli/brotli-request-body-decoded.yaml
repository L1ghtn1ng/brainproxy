id: bp-brotli-request-body-decoded
info:
  name: Brotli-compressed request bodies are decoded (CVE-2026-111497 exposure)
  severity: info
  confidence: high
  description: |
    The server decodes request bodies sent Brotli-compressed (Content-Encoding: br): a
    compressed "{}" is accepted like the plain one, and a compressed "{" is rejected like
    the plain one, so the server read what was inside. CVE-2026-111497
    (GHSA-9v8h-qqgm-4m35) is an out-of-bounds write in Google's Brotli decoder, versions
    1.0.3 to 1.2.0: a crafted compressed body can crash the process, leak its memory, or
    run code. Node.js 22, 24 and 26 bundle that decoder, and Express 5 (body-parser 2),
    Koa's body parsers and Fastify with @fastify/compress decode Brotli bodies by default.
    This shows the decoder is reachable, not that it is unpatched: there is no safe way to
    test that remotely. The check sends four small JSON POSTs to the site's root, two of
    them with valid Brotli data; it never sends malformed compressed data.
  remediation: |
    Update the runtime and libraries that decode Brotli: Node.js 22.23.4, 24.22.1 or
    26.12.1 (Node.js 20 and older get no fix), Bun 1.4.4, Brotli 1.0.10, 1.1.1 or 1.2.1
    (also the system libbrotli that distribution builds of Node.js link against), Python
    Brotli 1.2.1 or brotlicffi 1.2.1.0. Rebuild container images and apps that bundle a
    runtime. If the application doesn't need compressed request bodies, reject them before
    they reach it: answer 415 for any Content-Encoding containing br at the proxy or in a
    middleware that runs before the body parsers.
  reference:
    - https://github.com/advisories/GHSA-9v8h-qqgm-4m35
    - https://github.com/google/brotli/releases/tag/v1.2.1
    - https://vercel.com/kb/bulletin/node-js-security-advisory
  classification:
    cwe-id: CWE-787
  tags: cve,cve2026,brotli,nodejs,exposure,quick-check
http:
  # The plain bodies: does the root parse JSON at all ("{}" and "{" answered differently)?
  - method: POST
    path: ["{{BaseURL}}/"]
    headers: {Content-Type: application/json}
    body: "{}"
    extractors:
      - {type: dsl, name: plain_ok, internal: true, dsl: [status_code]}
  - method: POST
    path: ["{{BaseURL}}/"]
    headers: {Content-Type: application/json}
    body: "{"
    extractors:
      - {type: dsl, name: plain_bad, internal: true, dsl: [status_code]}
  # The same bodies, Brotli-compressed (valid streams for "{}" and "{").
  - method: POST
    path: ["{{BaseURL}}/"]
    headers: {Content-Type: application/json, Content-Encoding: br}
    body-hex: 8f00807b7d03
    extractors:
      - {type: dsl, name: br_ok, internal: true, dsl: [status_code]}
  - method: POST
    path: ["{{BaseURL}}/"]
    headers: {Content-Type: application/json, Content-Encoding: br}
    body-hex: 0f00807b03
    matchers:
      - type: dsl
        dsl:
          - "plain_ok != plain_bad && plain_bad >= 400 && br_ok == plain_ok && status_code == plain_bad && status_code != 415"
