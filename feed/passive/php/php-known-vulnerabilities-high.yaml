id: bp-php-known-vulnerabilities-high
info:
  name: "PHP version with known high severity vulnerabilities"
  severity: high
  confidence: medium
  description: |
    The server disclosed its PHP version in a response header, and that version is
    affected by known high severity vulnerabilities in PHP itself. The matched
    vulnerabilities are listed in the other info; versions are compared against PHP's
    published security advisories. Some distributions backport security fixes without
    changing the version number, so check whether the fixes have been applied before
    reporting these as confirmed.
    Covered: CVE-2023-0662, CVE-2023-3823, CVE-2024-2757, CVE-2024-4577, CVE-2024-5585, CVE-2024-8929, CVE-2025-14179, CVE-2026-12184, CVE-2026-17543, CVE-2026-17544, CVE-2026-6722, CVE-2026-7263, CVE-2026-91765.
  remediation: |
    Upgrade PHP to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing the PHP version: set
    expose_php = Off in php.ini and remove version details from the Server header.
  reference:
    - https://www.php.net/supported-versions.php
    - https://github.com/php/php-src/security/advisories
  classification:
    cwe-id: CWE-1395
  tags: php,cve,version,passive,high
scope: passive
http:
  - extractors:
      - type: regex
        name: php
        part: header
        group: 1
        regex:
          - '(?im)(?:^|[^\w-])PHP/(\d{1,6}\.\d{1,6}\.\d{1,6})'
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2026-6722 Use-After-Free in SOAP using Apache map with Remote Code Execution"
        dsl:
          - "compare_versions(php, '>= 8.3.0, < 8.3.31') || compare_versions(php, '>= 8.4.0, < 8.4.21') || compare_versions(php, '>= 8.5.0, < 8.5.6')"
      - type: dsl
        name: "CVE-2026-6722 Use-After-Free in SOAP using Apache map with Remote Code Execution (assumed: branch not covered by the advisory)"
        dsl:
