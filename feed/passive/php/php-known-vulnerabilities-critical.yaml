# Generated by scripts/php_feed.py from ZAP's php-known-vulnerabilities.json (2026-10-22).
# Covers ZAP ServerSideVersionScanRule (pscanrules, Apache License 2.0). Don't edit by hand.
id: bp-php-known-vulnerabilities-critical
info:
  name: "PHP version with known critical severity vulnerabilities"
  severity: critical
  confidence: medium
  description: |
    The server disclosed its PHP version in a response header, and that version is
    affected by known critical severity vulnerabilities in PHP itself. The matched
    vulnerabilities are listed in the other info; versions are compared against PHP's
    published security advisories. Some distributions backport security fixes without
    changing the version number, so check whether the fixes have been applied before
    reporting these as confirmed.
    Covered: CVE-2019-11043, CVE-2023-3824, CVE-2024-1874.
  remediation: |
    Upgrade PHP to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing the PHP version: set
    expose_php = Off in php.ini and remove version details from the Server header.
  reference:
    - https://www.php.net/supported-versions.php
    - https://github.com/php/php-src/security/advisories
  classification:
    cwe-id: CWE-1395
  tags: php,cve,version,passive,critical
scope: passive
http:
  - extractors:
      - type: regex
        name: php
        part: header
        group: 1
        regex:
          - '(?im)(?:^|[^\w-])PHP/(\d{1,6}\.\d{1,6}\.\d{1,6})'
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2019-11043 PHP-FPM remote code execution"
        dsl:
          - "compare_versions(php, '>= 7.3.0, < 7.3.11') || compare_versions(php, '>= 7.2.0, < 7.2.24') || compare_versions(php, '>= 7.1.0, < 7.1.33')"
      - type: dsl
        name: "CVE-2023-3824 Buffer overflow and overread in phar_dir_read() (assumed: branch not covered by the advisory)"
        dsl:
          - "compare_versions(php, '< 8.0.30')"
      - type: dsl
        name: "CVE-2024-1874 Command injection via array-ish $command parameter of proc_open even if bypass_shell option enabled on Windows"
        dsl:
          - "compare_versions(php, '>= 8.2.0, < 8.2.18') || compare_versions(php, '>= 8.3.0, < 8.3.6')"
      - type: dsl
        name: "CVE-2024-1874 Command injection via array-ish $command parameter of proc_open even if bypass_shell option enabled on Windows (assumed: branch not covered by the advisory)"
        dsl:
          - "compare_versions(php, '< 8.1.28')"
