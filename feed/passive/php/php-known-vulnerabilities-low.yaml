# Generated by scripts/php_feed.py from ZAP's php-known-vulnerabilities.json (2026-10-22).
# Covers ZAP ServerSideVersionScanRule (pscanrules, Apache License 2.0). Don't edit by hand.
id: bp-php-known-vulnerabilities-low
info:
  name: "PHP version with known low severity vulnerabilities"
  severity: low
  confidence: medium
  description: |
    The server disclosed its PHP version in a response header, and that version is
    affected by known low severity vulnerabilities in PHP itself. The matched
    vulnerabilities are listed in the other info; versions are compared against PHP's
    published security advisories. Some distributions backport security fixes without
    changing the version number, so check whether the fixes have been applied before
    reporting these as confirmed.
    Covered: CVE-2023-0567, CVE-2023-3247, CVE-2024-3096, CVE-2024-8925, CVE-2024-9026, CVE-2025-1218, CVE-2025-1220, CVE-2026-7259, CVE-2026-7568.
  remediation: |
    Upgrade PHP to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing the PHP version: set
    expose_php = Off in php.ini and remove version details from the Server header.
  reference:
    - https://www.php.net/supported-versions.php
    - https://github.com/php/php-src/security/advisories
  classification:
    cwe-id: CWE-1395
  tags: php,cve,version,passive,low
scope: passive
http:
  - extractors:
      - type: regex
        name: php
        part: header
        group: 1
        regex:
          - '(?im)(?:^|[^\w-])PHP/(\d{1,6}\.\d{1,6}\.\d{1,6})'
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2024-9026 [PHP-FPM] Logs from childrens may be altered"
        dsl:
          - "compare_versions(php, '>= 8.2.0, < 8.2.24') || compare_versions(php, '>= 8.3.0, < 8.3.12')"
      - type: dsl
        name: "CVE-2024-9026 [PHP-FPM] Logs from childrens may be altered (assumed: branch not covered by the advisory)"
        dsl:
          - "compare_versions(php, '< 8.1.30')"
      - type: dsl
        name: "CVE-2024-8925 Erroneous parsing of multipart form data"
        dsl:
          - "compare_versions(php, '>= 8.2.0, < 8.2.24') || compare_versions(php, '>= 8.3.0, < 8.3.12')"
      - type: dsl
        name: "CVE-2024-8925 Erroneous parsing of multipart form data (assumed: branch not covered by the advisory)"
        dsl:
